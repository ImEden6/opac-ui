plugins {
	id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

loom {
	runs {
		// Second client instance for local multiplayer testing (party/ally features
		// need two distinct players). Own run dir + offline username so it doesn't
		// collide with the default `client` run's account or files.
		client2 {
			client()
			name "Fabric Client 2"
			source sourceSets.main
			runDir "run2"
			programArgs "--username", "Tester2"
		}
		server {
			runDir "run-server"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Dependencies
	implementation "curse.maven:open-parties-and-claims-636608:${project.opac_fabric}"
	// OPAC's Fabric build needs Forge Config API Port (its config system, ported to Fabric)
	implementation "curse.maven:forge-config-api-port-547434:${project.forgeconfigapiport_fabric}"

	// Visibility into common's source for the IDE/build ordering; common's actual
	// classes are compiled straight into this module via the source(...) block below.
	compileOnly project(":common")
}

compileJava {
	source(project(":common").sourceSets.main.allSource)
}

processResources {
	from project(":common").sourceSets.main.resources

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}
