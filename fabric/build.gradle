plugins {
	id 'fabric-loom' version '1.16-SNAPSHOT'
}

loom {
	runs {
		// Second client instance for local multiplayer testing (party/ally features
		// need two distinct players). Own run dir + offline username so it doesn't
		// collide with the default `client` run's account or files.
		client2 {
			client()
			name "Fabric Client 2"
			source sourceSets.main
			runDir "run2"
			programArgs "--username", "Tester2"
		}
		server {
			runDir "run-server"
		}
	}
}

// Screenshot tests that drive a real client: ./gradlew :fabric:runClientGameTest.
// They live in src/gametest and never end up in the release jar.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "opacui-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

repositories {
	maven {
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
		content {
			includeGroup "fuzs.forgeconfigapiport"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Dependencies
	modImplementation "curse.maven:open-parties-and-claims-636608:${project.opac_fabric}"
	// OPAC's Fabric build needs Forge Config API Port (its config system, ported to Fabric)
	modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forgeconfigapiport_fabric}"

	// Visibility into common's source for the IDE/build ordering; common's actual
	// classes are compiled straight into this module via the source(...) block below.
	compileOnly project(":common")
}

compileJava {
	source(project(":common").sourceSets.main.allSource)
}

processResources {
	from project(":common").sourceSets.main.resources

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}
