plugins {
	id 'architectury-plugin'
	id 'dev.architectury.loom'
	id 'com.github.johnrengelman.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	runs {
		// Second client instance for local multiplayer testing (party/ally features
		// need two distinct players). Own run dir + offline username so it doesn't
		// collide with the default `client` run's account or files.
		client2 {
			client()
			name "Fabric Client 2"
			source sourceSets.main
			runDir "run2"
			programArgs "--username", "Tester2"
		}
		server {
			runDir "run-server"
		}
	}
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url = "https://maven.shedaniel.me/"
		content {
			includeGroup "me.shedaniel.cloth"
		}
	}
}

configurations {
	common
	shadowCommon
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Dependencies
	modImplementation "curse.maven:open-parties-and-claims-636608:${project.opac_fabric}"
	modImplementation "curse.maven:cloth-config-348521:${project.cloth_config_fabric}"
	// OPAC's Fabric build needs Forge Config API Port (its config system, ported to Fabric)
	modImplementation "maven.modrinth:forge-config-api-port:v8.0.3-1.20.1-Fabric"
	// Cloth Config needs its own basic-math lib (Rectangle/Point); curse.maven jars carry
	// no dependency metadata so it never gets pulled in transitively
	implementation "me.shedaniel.cloth:basic-math:0.6.1"

	common(project(path: ":common", configuration: "namedElements")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

shadowJar {
	configurations = [project.configurations.shadowCommon]
	archiveClassifier.set("dev-shadow")
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier.set(null)
}

jar {
	archiveClassifier.set("dev")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}
