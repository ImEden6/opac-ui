plugins {
	id 'org.spongepowered.gradle.vanilla' version '0.3.2-SNAPSHOT'
}

base {
	archivesName = "opacui-common-${project.minecraft_version}"
}

minecraft {
	version(project.minecraft_version)
}

dependencies {
	// Mod Dependencies for compilation in common
	compileOnly "curse.maven:open-parties-and-claims-636608:${project.opac_fabric}"
}

processResources {
	def buildProps = project.properties.clone()
	filesMatching(['pack.mcmeta']) {
		expand buildProps
	}
}

java {
	withSourcesJar()
}
