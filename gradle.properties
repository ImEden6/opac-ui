# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Sponge Gradle Vanilla / ForgeGradle 7 / NeoGradle 7.1.22 all require the Gradle
# daemon itself to run on Java 25+, not just the project's compile toolchain.
# Portable across machines/CI via gradle/gradle-daemon-jvm.properties (auto-provisioned
# through the foojay-resolver-convention plugin in settings.gradle) — do NOT hardcode
# org.gradle.java.home here, it's machine-specific and breaks CI.

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.3
fabric_loader_version=0.19.5

# Forge & NeoForge Properties
forge_version=66.0.9
neoforge_version=26.3.0.55-beta

# Mod Properties
mod_version=1.0.0
maven_group=mervyn

# Dependencies
fabric_api_version=0.162.0+26.3
opac_fabric=9066788
opac_forge=9066814
opac_neoforge=9066802
forgeconfigapiport_fabric=8938808
forgeconfigapiport_forge=8938807
