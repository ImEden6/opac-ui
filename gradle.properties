# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Sponge Gradle Vanilla / ForgeGradle 7 / NeoGradle 7.1.22 all require the Gradle
# daemon itself to run on Java 25+, not just the project's compile toolchain.
# Portable across machines/CI via gradle/gradle-daemon-jvm.properties (auto-provisioned
# through the foojay-resolver-convention plugin in settings.gradle) — do NOT hardcode
# org.gradle.java.home here, it's machine-specific and breaks CI.

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.1.2
fabric_loader_version=0.19.1

# Forge & NeoForge Properties
forge_version=64.0.11
neoforge_version=26.1.2.22-beta

# Mod Properties
mod_version=1.0.6
maven_group=mervyn

# Where publishMods uploads releases: the project ID shown on each project's page. Leave one
# empty to skip that site.
modrinth_project_id=PriJM6Wm
curseforge_project_id=1633264

# Dependencies
fabric_api_version=0.145.4+26.1.2
opac_fabric=9222099
opac_forge=9222078
opac_neoforge=9222090
forgeconfigapiport_fabric=8218664
forgeconfigapiport_forge=8218663
