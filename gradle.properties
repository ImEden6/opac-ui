# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Sponge Gradle Vanilla / ForgeGradle 7 / NeoGradle 7.1.22 all require the Gradle
# daemon itself to run on Java 25+, not just the project's compile toolchain.
# Portable across machines/CI via gradle/gradle-daemon-jvm.properties (auto-provisioned
# through the foojay-resolver-convention plugin in settings.gradle) — do NOT hardcode
# org.gradle.java.home here, it's machine-specific and breaks CI.

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.2
fabric_loader_version=0.19.3

# Forge & NeoForge Properties
forge_version=65.1.0
neoforge_version=26.2.0.75

# Mod Properties
mod_version=1.0.0
maven_group=mervyn

# Dependencies
fabric_api_version=0.159.0+26.2
opac_fabric=8690653
opac_forge=8690650
opac_neoforge=8690652
forgeconfigapiport_fabric=8292030
forgeconfigapiport_forge=8292029
