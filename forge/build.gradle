plugins {
	id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
	version = project.forge_version

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}

	mods {
		opacui {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	compileOnly project(":common")

	// Dependencies provided by user for Forge
	modImplementation "curse.maven:cloth-config-348521:${project.cloth_config_forge}"
	modImplementation "curse.maven:open-parties-and-claims-636608:${project.opac_forge}"
}

compileJava {
	source(project(":common").sourceSets.main.allSource)
}

processResources {
	from project(":common").sourceSets.main.resources

	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/mods.toml") {
		expand "version": version
	}
}

java {
	withSourcesJar()
}

tasks.named("sourcesJar", Jar) {
	from(project(":common").sourceSets.main.allSource)
}

jar {
	finalizedBy 'reobfJar'
}
