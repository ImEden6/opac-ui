plugins {
	id 'idea'
	id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

java.withSourcesJar()

minecraft {
	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir('run')
		}

		register('client')

		register('server') {
			args '--nogui'
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
	compileOnly project(":common")

	// Dependencies provided by user for Forge
	implementation "curse.maven:cloth-config-348521:${project.cloth_config_forge}"
	implementation "curse.maven:open-parties-and-claims-636608:${project.opac_forge}"
	// Runtime-only: satisfies openpartiesandclaims' mandatory forgeconfigapiport dependency
	implementation("curse.maven:forge-config-api-port-547434:${project.forgeconfigapiport_forge}") { transitive = false }

	// Two jopt-simple versions (5.0.4 and 6.0-alpha-3) on the module path break
	// Forge's JPMS bootstrap resolution ("Module jopt.simple not found").
	implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

compileJava {
	source(project(":common").sourceSets.main.allSource)
}

processResources {
	from project(":common").sourceSets.main.resources

	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/mods.toml") {
		expand "version": version
	}
}

tasks.named("sourcesJar", Jar) {
	from(project(":common").sourceSets.main.allSource)
}

sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}
