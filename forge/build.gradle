plugins {
	id 'idea'
	id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

java.withSourcesJar()

jar {
	manifest {
		attributes["MixinConfigs"] = "opacui.common.mixins.json"
	}
}

minecraft {
	runs {
		configureEach {
			workingDir = layout.projectDirectory.dir('run')
			// Mixin requires either specifying the config via command line, or in the Manifest
			args "--mixin.config=opacui.common.mixins.json"
		}

		register('client')

		register('server') {
			args '--nogui'
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
	compileOnly project(":common")

	// forgeconfigapiport pulls in a transitive dep that conflicts without this
	implementation("io.github.llamalad7:mixinextras-forge:0.3.5")

	// Dependencies provided by user for Forge
	implementation "curse.maven:open-parties-and-claims-636608:${project.opac_forge}"
	// Runtime-only: satisfies openpartiesandclaims' mandatory forgeconfigapiport dependency
	implementation("curse.maven:forge-config-api-port-547434:${project.forgeconfigapiport_forge}") { transitive = false }

	// Hack fix: force jopt-simple to exactly 5.0.4 (Mojang ships that version, but some
	// transitive dependencies request 6.0+, which breaks Forge's JPMS bootstrap resolution)
	implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

compileJava {
	source(project(":common").sourceSets.main.allSource)
}

processResources {
	from project(":common").sourceSets.main.resources

	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/mods.toml") {
		expand "version": version
	}
}

tasks.named("sourcesJar", Jar) {
	from(project(":common").sourceSets.main.allSource)
}

sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}
