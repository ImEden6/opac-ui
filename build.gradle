plugins {
	id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1' // required for NeoGradle to work
	id 'maven-publish'
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'maven-publish'

	version = rootProject.mod_version
	group = rootProject.maven_group

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.release = 25
	}

	afterEvaluate {
		base {
			archivesName = "opacui-${project.name}-${rootProject.minecraft_version}"
		}
	}

	repositories {
		mavenCentral()
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		maven {
			url = "https://cursemaven.com"
			content {
				includeGroup "curse.maven"
			}
		}
	}
}
